<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yuvaraj Accounting & Taxation Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'navy': '#0a192f',
              'gold': '#d4af37',
            },
            fontFamily: {
              'sans': ['Poppins', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fade-in 0.5s ease-out forwards',
            },
            keyframes: {
              'fade-in': {
                'from': { opacity: '0', transform: 'translateY(20px)' },
                'to': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        scroll-behavior: smooth;
      }
      
      .text-gradient-gold {
        background: linear-gradient(90deg, #F7D16E, #D4AF37);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
      }

      @keyframes move-particles-finance {
        0% {
          background-position: 
            0 0, 0 0, /* grid */
            15% 50%, /* particle 1 */
            80% 30%, /* particle 2 */
            30% 90%; /* particle 3 */
        }
        50% {
          background-position: 
            -25px -25px, -25px -25px, /* grid */
            50% 10%, /* particle 1 */
            40% 70%, /* particle 2 */
            90% 20%; /* particle 3 */
        }
        100% {
          background-position: 
            -50px -50px, -50px -50px, /* grid */
            15% 50%, /* particle 1 */
            80% 30%, /* particle 2 */
            30% 90%; /* particle 3 */
        }
      }

      .particle-bg {
        background-color: #0a192f;
        background-image: 
          /* Faint grid for a financial/tech look */
          linear-gradient(rgba(212, 175, 55, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(212, 175, 55, 0.07) 1px, transparent 1px),
          /* Soft, glowing particles */
          radial-gradient(circle at center, rgba(212, 175, 55, 0.15) 0%, transparent 40%),
          radial-gradient(circle at center, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
          radial-gradient(circle at center, rgba(212, 175, 55, 0.1) 0%, transparent 60%);
        background-size: 
          50px 50px, /* grid size */
          50px 50px, /* grid size */
          30em 30em, /* particle size 1 */
          45em 45em, /* particle size 2 */
          25em 25em; /* particle size 3 */
        background-repeat: repeat, repeat, no-repeat, no-repeat, no-repeat;
        animation: move-particles-finance 30s ease-in-out infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
